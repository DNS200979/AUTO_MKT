[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-market-api"
version = "0.1.0"
description = "Backend do MVP da plataforma para mercados autonomos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic[email]>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.22,<1",
  "PyJWT[crypto]>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
notification-worker = "market_api.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/market_api/main.py" = ["B008"]
